<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЕланьРыбалка</title>

  <!-- VK Bridge SDK -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif;
      background-color: #19191a;
      color: #e1e3e6;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    header {
      background: #222222;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333333;
      z-index: 1000;
      gap: 8px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .top-btn {
      background: #2688eb;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .top-btn.secondary {
      background: #333333;
      color: #e1e3e6;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Карточки Leaflet */
    .leaflet-popup-content-wrapper {
      background: #242424;
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: #242424;
    }
    .spot-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #4bb34b;
    }
    .spot-card.report h3 {
      color: #ff9e00;
    }
    .spot-card p {
      font-size: 12px;
      margin: 3px 0;
      line-height: 1.4;
      color: #b2b2b2;
    }
    .spot-card b {
      color: #e1e3e6;
    }

    /* Теги условий подъезда и берега */
    .conditions-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #1c1c1e;
      padding: 6px 8px;
      border-radius: 8px;
      margin: 6px 0;
      border: 1px solid #303033;
    }
    .cond-tag {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #d1d5db;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-copy { background: #333333; color: #e1e3e6; }
    .btn-nav { background: #2688eb; color: #ffffff; }
    .btn-add-here { background: #ff9e00; color: #19191a; font-weight: 600; }
    .btn-del { background: #e64646; color: #fff; }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 12px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #232324;
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #38383a;
    }
    .modal h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      background: #151516;
      border: 1px solid #3d3d40;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 55px;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #2688eb;
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #4bb34b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Список отчетов */
    .report-item {
      background: #1a1a1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #2f2f32;
    }
    .report-item h4 {
      color: #ff9e00;
      font-size: 14px;
      margin-bottom: 4px;
    }

    /* Уведомление Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 9999;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h1>🎣 ЕланьРыбалка</h1>
      <div class="header-actions">
        <button class="top-btn secondary" onclick="openReportsList()">📋 Отчеты</button>
        <button class="top-btn" onclick="openReportModal()">+ Добавить</button>
      </div>
    </header>
    <div id="map"></div>
  </div>

  <!-- Модальное окно создания отчета -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal">
      <h2>Новый отчет о рыбалке <button class="close-btn" onclick="closeReportModal()">&times;</button></h2>
      
      <div class="form-group">
        <label>Название пруда / реки / балки *</label>
        <input type="text" id="spotName" placeholder="например: Пруд у Вязовки или Заводь на Медведице">
      </div>

      <div class="form-group">
        <label>Район</label>
        <select id="spotDistrict">
          <option value="Еланский р-н">Еланский р-н</option>
          <option value="Руднянский р-н">Руднянский р-н</option>
          <option value="Соседний / Другой">Соседний / Другой</option>
        </select>
      </div>

      <div class="form-group">
        <label>Координаты (широта, долгота) *</label>
        <input type="text" id="spotCoords" placeholder="50.9392, 42.0628">
      </div>

      <div class="form-group">
        <label>Качество подъезда и дороги</label>
        <select id="roadCondition">
          <option value="🚗 Асфальт / щебень (любое авто)">🚗 Асфальт / щебень (любое авто)</option>
          <option value="🌾 Грунтовка (проезд в сухую погоду)">🌾 Грунтовка (проезд в сухую погоду)</option>
          <option value="🚜 Колея / глина (только 4х4 / нива / уазик)">🚜 Колея / глина (только 4х4 / нива / уазик)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Места для береговой ловли</label>
        <select id="shoreCondition">
          <option value="🎣 Удобный чистый берег / поляны">🎣 Удобный чистый берег / поляны</option>
          <option value="🌿 Камыш, прогалы есть, сапоги нужны">🌿 Камыш, прогалы есть, сапоги нужны</option>
          <option value="🚫 Берег заросший / крутой обрыв">🚫 Берег заросший / крутой обрыв</option>
        </select>
      </div>

      <div class="form-group">
        <label>Спуск лодки на воду</label>
        <select id="boatCondition">
          <option value="🚤 Есть твердый пологий спуск (прицеп/слип)">🚤 Есть твердый пологий спуск (прицеп/слип)</option>
          <option value="🛶 Только спуск на руках (ПВХ/резинка)">🛶 Только спуск на руках (ПВХ/резинка)</option>
          <option value="❌ Спуска для лодок нет">❌ Спуска для лодок нет</option>
        </select>
      </div>

      <div class="form-group">
        <label>Дата рыбалки</label>
        <input type="date" id="spotDate">
      </div>

      <div class="form-group">
        <label>Улов и снасти</label>
        <input type="text" id="spotFish" placeholder="например: 5 карасей по 500г, щука на воблер">
      </div>

      <div class="form-group">
        <label>Дополнительные заметки</label>
        <textarea id="spotNotes" placeholder="Где лучше ставить лагерь, какая глубина, зацепы..."></textarea>
      </div>

      <button class="btn-submit" onclick="saveFishingReport()">Сохранить на карте</button>
    </div>
  </div>

  <!-- Модальное окно списка отчетов -->
  <div class="modal-overlay" id="listModal">
    <div class="modal">
      <h2>Сохраненные отчеты <button class="close-btn" onclick="closeListModal()">&times;</button></h2>
      <div id="reportsContainer"></div>
    </div>
  </div>

  <div id="toast">Координаты скопированы!</div>

  <script>
    // 1. VK Bridge Init
    if (typeof vkBridge !== 'undefined') {
      vkBridge.send('VKWebAppInit');
    }

    // 2. Toast
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // 3. Копирование координат
    window.copyCoords = function(lat, lng) {
      const text = `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`Скопировано: ${text}`);
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    };

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`Скопировано: ${text}`);
      } catch (err) {
        prompt('Скопируйте координаты вручную:', text);
      }
      document.body.removeChild(textarea);
    }

    // 4. Карта Leaflet
    const map = L.map('map').setView([50.86, 43.30], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const reportIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // 5. Базовые водоемы районов
    const defaultSpots = [
      {
        name: "Слияние р. Елань и р. Терса",
        district: "Еланский р-н",
        coords: [50.9392, 42.0628],
        fish: "Щука, судак, голавль, окунь, лещ",
        type: "Река / перекаты и ямы",
        road: "🚗 Асфальт / щебень (в черте поселка)",
        shore: "🎣 Есть пологие подходы и мостки",
        boat: "🛶 Спуск ПВХ с песчаной косы"
      },
      {
        name: "Река Терса у с. Вязовка",
        district: "Еланский р-н",
        coords: [50.8495, 42.2741],
        fish: "Щука, жерех, голавль, язь, окунь",
        type: "Река / омуты, коряжник",
        road: "🌾 Грунтовка (после дождя вязко)",
        shore: "🌿 Местами крутояры, прогалы в кустах",
        boat: "🛶 Спуск лодки на руках"
      },
      {
        name: "Большеморецкий пруд",
        district: "Еланский р-н",
        coords: [50.9015, 42.3412],
        fish: "Карась, карп, окунь",
        type: "Степной балочный пруд",
        road: "🌾 Полевая грунтовка",
        shore: "🌿 Прогалы в камыше, плотина",
        boat: "❌ Мелководный берег / заросший"
      },
      {
        name: "Устье Терсы (впадение в Медведицу)",
        district: "Руднянский р-н",
        coords: [50.7925, 44.5480],
        fish: "Сом, судак, сазан, щука, жерех",
        type: "Слияние рек / Рудня",
        road: "🚗 Подъезд нормальный по окраине Рудни",
        shore: "🎣 Песчаные косы и обрывы",
        boat: "🚤 Есть места для съезда лодки"
      },
      {
        name: "Река Медведица у с. Лемешкино",
        district: "Руднянский р-н",
        coords: [50.8932, 44.4921],
        fish: "Голавль, жерех, щука, судак",
        type: "Река / перекаты",
        road: "🌾 Твердая грунтовка вдоль поймы",
        shore: "🎣 Удобный перекат, пляжи",
        boat: "🛶 Спуск на руках (ПВХ)"
      },
      {
        name: "Пруд у с. Осички",
        district: "Руднянский р-н",
        coords: [50.6415, 44.4830],
        fish: "Карп, карась, толстолобик",
        type: "Крупный пруд",
        road: "🌾 Наезженная полевая дорога",
        shore: "🎣 Много чистых мест под карповики",
        boat: "🛶 Спуск надувной лодки с берега"
      }
    ];

    defaultSpots.forEach(spot => {
      const lat = spot.coords[0];
      const lng = spot.coords[1];

      const popupHtml = `
        <div class="spot-card">
          <h3>${spot.name}</h3>
          <p><b>Район:</b> ${spot.district}</p>
          <p><b>Рыба:</b> ${spot.fish}</p>
          <div class="conditions-grid">
            <div class="cond-tag">${spot.road}</div>
            <div class="cond-tag">${spot.shore}</div>
            <div class="cond-tag">${spot.boat}</div>
          </div>
          <p><b>Координаты:</b> ${lat.toFixed(5)}, ${lng.toFixed(5)}</p>
          <div class="btn-group">
            <button class="btn btn-copy" onclick="copyCoords(${lat}, ${lng})">📋 Копировать</button>
            <a class="btn btn-nav" href="https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank">Маршрут</a>
          </div>
        </div>
      `;
      L.marker([lat, lng]).addTo(map).bindPopup(popupHtml);
    });

    // 6. Хранилище отчетов
    let userReports = JSON.parse(localStorage.getItem('elan_fish_reports') || '[]');
    let userMarkersLayer = L.layerGroup().addTo(map);

    function renderUserReports() {
      userMarkersLayer.clearLayers();

      userReports.forEach((rep, idx) => {
        const popupHtml = `
          <div class="spot-card report">
            <h3>📝 Отчет: ${rep.name}</h3>
            <p><b>Дата:</b> ${rep.date || 'Не указана'} (${rep.district})</p>
            <p><b>Улов / снасть:</b> ${rep.fish || 'Не указано'}</p>
            <div class="conditions-grid">
              <div class="cond-tag">${rep.road}</div>
              <div class="cond-tag">${rep.shore}</div>
              <div class="cond-tag">${rep.boat}</div>
            </div>
            ${rep.notes ? `<p><b>Заметки:</b> ${rep.notes}</p>` : ''}
            <p><b>Координаты:</b> ${rep.lat.toFixed(5)}, ${rep.lng.toFixed(5)}</p>
            <div class="btn-group">
              <button class="btn btn-copy" onclick="copyCoords(${rep.lat}, ${rep.lng})">📋 Коорд.</button>
              <a class="btn btn-nav" href="https://yandex.ru/maps/?rtext=~${rep.lat},${rep.lng}&rtt=auto" target="_blank">Карты</a>
              <button class="btn btn-del" onclick="deleteReport(${idx})">Удалить</button>
            </div>
          </div>
        `;

        L.marker([rep.lat, rep.lng], { icon: reportIcon })
          .addTo(userMarkersLayer)
          .bindPopup(popupHtml);
      });
    }

    renderUserReports();

    // 7. Управление окнами
    function openReportModal(lat = '', lng = '') {
      if (lat && lng) {
        document.getElementById('spotCoords').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      }
      document.getElementById('spotDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('reportModal').classList.add('active');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('active');
    }

    function openReportsList() {
      const container = document.getElementById('reportsContainer');
      if (userReports.length === 0) {
        container.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding: 20px 0;">У вас пока нет сохраненных отчетов.</p>';
      } else {
        container.innerHTML = userReports.map((r, i) => `
          <div class="report-item">
            <h4>${r.name} (${r.district})</h4>
            <div class="conditions-grid" style="margin: 6px 0;">
              <div class="cond-tag">${r.road}</div>
              <div class="cond-tag">${r.shore}</div>
              <div class="cond-tag">${r.boat}</div>
            </div>
            <p style="font-size:12px; margin: 3px 0;"><b>Улов:</b> ${r.fish || '-'}</p>
            <p style="font-size:11px; color:#aaa;">Дата: ${r.date || '-'} | Координаты: ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</p>
            <div class="btn-group" style="margin-top:8px;">
              <button class="btn btn-copy" onclick="copyCoords(${r.lat}, ${r.lng})">📋 Координаты</button>
              <button class="btn btn-del" onclick="deleteReport(${i})">Удалить</button>
            </div>
          </div>
        `).join('');
      }
      document.getElementById('listModal').classList.add('active');
    }

    function closeListModal() {
      document.getElementById('listModal').classList.remove('active');
    }

    function saveFishingReport() {
      const name = document.getElementById('spotName').value.trim();
      const district = document.getElementById('spotDistrict').value;
      const coordsRaw = document.getElementById('spotCoords').value.trim();
      const road = document.getElementById('roadCondition').value;
      const shore = document.getElementById('shoreCondition').value;
      const boat = document.getElementById('boatCondition').value;
      const date = document.getElementById('spotDate').value;
      const fish = document.getElementById('spotFish').value.trim();
      const notes = document.getElementById('spotNotes').value.trim();

      if (!name) {
        alert('Пожалуйста, введите название водоема.');
        return;
      }

      const parts = coordsRaw.split(/[,;\s]+/).map(p => parseFloat(p));
      if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) {
        alert('Пожалуйста, укажите координаты корректно (например: 50.9392, 42.0628).');
        return;
      }

      userReports.push({
        name,
        district,
        lat: parts[0],
        lng: parts[1],
        road,
        shore,
        boat,
        date,
        fish,
        notes
      });

      localStorage.setItem('elan_fish_reports', JSON.stringify(userReports));
      renderUserReports();
      closeReportModal();

      document.getElementById('spotName').value = '';
      document.getElementById('spotCoords').value = '';
      document.getElementById('spotFish').value = '';
      document.getElementById('spotNotes').value = '';

      showToast('Отчет и характеристики сохранены!');
    }

    window.deleteReport = function(index) {
      if (confirm('Удалить этот отчет?')) {
        userReports.splice(index, 1);
        localStorage.setItem('elan_fish_reports', JSON.stringify(userReports));
        renderUserReports();
        openReportsList();
        showToast('Отчет удален');
      }
    };

    // Клик по карте
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <div class="spot-card">
            <h3>Выбранная точка</h3>
            <p><b>Координаты:</b> ${lat.toFixed(6)}, ${lng.toFixed(6)}</p>
            <div class="btn-group" style="flex-direction: column;">
              <button class="btn btn-add-here" onclick="openReportModal(${lat}, ${lng})">📝 Записать отчет тут</button>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-copy" onclick="copyCoords(${lat}, ${lng})">📋 Скопировать</button>
                <a class="btn btn-nav" href="https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank">Маршрут</a>
              </div>
            </div>
          </div>
        `)
        .openOn(map);
    });
  </script>
</body>
</html>
