<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЕланьРыбалка</title>

  <!-- VK Bridge SDK -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif;
      background-color: #19191a;
      color: #e1e3e6;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }
    header {
      background: #222222;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333333;
      z-index: 1000;
      gap: 8px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .top-btn {
      background: #2688eb;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .top-btn.secondary {
      background: #333333;
      color: #e1e3e6;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Нижняя панель каталога прудов */
    #bottomPanel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26, 26, 27, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #38383a;
      z-index: 999;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: #2b2b2e;
      color: #aaa;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2688eb;
      color: #fff;
    }
    .spots-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .spot-chip {
      background: #242426;
      border: 1px solid #3a3a3d;
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 190px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .spot-chip:hover {
      border-color: #2688eb;
    }
    .spot-chip-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spot-chip-desc {
      font-size: 11px;
      color: #4bb34b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spot-chip-meta {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }

    /* Карточки Popup */
    .leaflet-popup-content-wrapper {
      background: #242424;
      color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip {
      background: #242424;
    }
    .spot-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
      color: #4bb34b;
    }
    .spot-card.report h3 {
      color: #ff9e00;
    }
    .spot-card p {
      font-size: 12px;
      margin: 3px 0;
      line-height: 1.4;
      color: #b2b2b2;
    }
    .spot-card b {
      color: #e1e3e6;
    }

    .conditions-grid {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #1c1c1e;
      padding: 6px 8px;
      border-radius: 8px;
      margin: 6px 0;
      border: 1px solid #303033;
    }
    .cond-tag {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #d1d5db;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-copy { background: #333333; color: #e1e3e6; }
    .btn-nav { background: #2688eb; color: #ffffff; }
    .btn-add-here { background: #ff9e00; color: #19191a; font-weight: 600; }
    .btn-del { background: #e64646; color: #fff; }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 12px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #232324;
      width: 100%;
      max-width: 440px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #38383a;
    }
    .modal h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      background: #151516;
      border: 1px solid #3d3d40;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 55px;
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #4bb34b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    #toast {
      position: fixed;
      top: 55px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 9999;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="app">
    <header>
      <h1>🎣 ЕланьРыбалка</h1>
      <div class="header-actions">
        <button class="top-btn secondary" onclick="openReportsList()">📋 Мои отчеты</button>
        <button class="top-btn" onclick="openReportModal()">+ Добавить</button>
      </div>
    </header>

    <div id="map"></div>

    <!-- Каталог-перечень прудов -->
    <div id="bottomPanel">
      <div class="panel-header">
        <span class="panel-title">Перечень водоемов:</span>
        <div class="filter-tabs">
          <button class="tab-btn active" onclick="filterSpots('all', this)">Все</button>
          <button class="tab-btn" onclick="filterSpots('Еланский р-н', this)">Елань</button>
          <button class="tab-btn" onclick="filterSpots('Руднянский р-н', this)">Рудня</button>
        </div>
      </div>
      <div class="spots-scroll" id="spotsList"></div>
    </div>
  </div>

  <!-- Модальное окно деталей водоема из перечня -->
  <div class="modal-overlay" id="spotDetailsModal">
    <div class="modal">
      <h2 id="detailName">Водоем <button class="close-btn" onclick="closeSpotDetails()">&times;</button></h2>
      <p style="font-size:12px; color:#aaa; margin-bottom: 8px;" id="detailDistrict"></p>
      <div class="conditions-grid" id="detailConditions"></div>
      <p style="font-size:13px; margin: 8px 0;" id="detailFish"></p>
      <p style="font-size:12px; color:#888;" id="detailCoords"></p>
      <div class="btn-group" style="margin-top: 14px;">
        <button class="btn btn-copy" id="detailBtnCopy">📋 Копировать коорд.</button>
        <a class="btn btn-nav" id="detailBtnNav" target="_blank">Маршрут в Яндекс</a>
      </div>
      <button class="btn btn-add-here" style="width: 100%; margin-top: 8px;" id="detailBtnReport">📝 Добавить отчет по этому водоему</button>
    </div>
  </div>

  <!-- Модальное окно создания отчета -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal">
      <h2>Новый отчет о рыбалке <button class="close-btn" onclick="closeReportModal()">&times;</button></h2>
      
      <div class="form-group">
        <label>Название пруда / реки *</label>
        <input type="text" id="spotName" placeholder="например: Пруд у х. Тростянка">
      </div>

      <div class="form-group">
        <label>Район</label>
        <select id="spotDistrict">
          <option value="Еланский р-н">Еланский р-н</option>
          <option value="Руднянский р-н">Руднянский р-н</option>
          <option value="Соседний / Другой">Соседний / Другой</option>
        </select>
      </div>

      <div class="form-group">
        <label>Координаты (широта, долгота) *</label>
        <input type="text" id="spotCoords" placeholder="50.9392, 42.0628">
      </div>

      <div class="form-group">
        <label>Качество подъезда и дороги</label>
        <select id="roadCondition">
          <option value="🚗 Асфальт / щебень (любое авто)">🚗 Асфальт / щебень (любое авто)</option>
          <option value="🌾 Грунтовка (проезд в сухую погоду)">🌾 Грунтовка (проезд в сухую погоду)</option>
          <option value="🚜 Колея / глина (только 4х4 / нива / уазик)">🚜 Колея / глина (только 4х4 / нива / уазик)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Места для береговой ловли</label>
        <select id="shoreCondition">
          <option value="🎣 Удобный чистый берег / поляны">🎣 Удобный чистый берег / поляны</option>
          <option value="🌿 Камыш, прогалы есть, сапоги нужны">🌿 Камыш, прогалы есть, сапоги нужны</option>
          <option value="🚫 Берег заросший / крутой обрыв">🚫 Берег заросший / крутой обрыв</option>
        </select>
      </div>

      <div class="form-group">
        <label>Спуск лодки на воду</label>
        <select id="boatCondition">
          <option value="🚤 Есть твердый пологий спуск (прицеп/слип)">🚤 Есть твердый пологий спуск (прицеп/слип)</option>
          <option value="🛶 Только спуск на руках (ПВХ/резинка)">🛶 Только спуск на руках (ПВХ/резинка)</option>
          <option value="❌ Спуска для лодок нет">❌ Спуска для лодок нет</option>
        </select>
      </div>

      <div class="form-group">
        <label>Дата рыбалки</label>
        <input type="date" id="spotDate">
      </div>

      <div class="form-group">
        <label>Улов и снасти</label>
        <input type="text" id="spotFish" placeholder="например: 4 карася по 500г, щука на воблер">
      </div>

      <div class="form-group">
        <label>Дополнительные заметки</label>
        <textarea id="spotNotes" placeholder="Где лучше встать, зацепы, глубина..."></textarea>
      </div>

      <button class="btn-submit" onclick="saveFishingReport()">Сохранить отчет</button>
    </div>
  </div>

  <!-- Модальное окно списка отчетов -->
  <div class="modal-overlay" id="listModal">
    <div class="modal">
      <h2>Мои отчеты <button class="close-btn" onclick="closeListModal()">&times;</button></h2>
      <div id="reportsContainer"></div>
    </div>
  </div>

  <div id="toast">Координаты скопированы!</div>

  <script>
    // 1. VK Bridge Init
    if (typeof vkBridge !== 'undefined') {
      vkBridge.send('VKWebAppInit');
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    window.copyCoords = function(lat, lng) {
      const text = `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`Скопировано: ${text}`));
      } else {
        prompt('Скопируйте координаты:', text);
      }
    };

    // 2. Слой спутника и схемы
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Esri World Imagery'
    });

    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: 'OpenStreetMap'
    });

    const map = L.map('map', {
      center: [50.88, 43.30],
      zoom: 10,
      layers: [satelliteLayer]
    });

    L.control.layers({ "🛰️ Спутник": satelliteLayer, "🗺️ Схема": streetLayer }).addTo(map);

    // 3. Каталог водоёмов (метки на карту НЕ выводятся, только перечень)
    const spotsDirectory = [
      {
        id: 1,
        name: "Слияние р. Елань и р. Терса",
        district: "Еланский р-н",
        coords: [50.9392, 42.0628],
        fish: "Щука, судак, голавль, окунь, лещ",
        road: "🚗 Асфальт / щебень (в черте поселка)",
        shore: "🎣 Есть пологие подходы и коса",
        boat: "🛶 Спуск ПВХ с косы"
      },
      {
        id: 2,
        name: "Река Терса у с. Вязовка",
        district: "Еланский р-н",
        coords: [50.8495, 42.2741],
        fish: "Щука, голавль, жерех, язь, окунь",
        road: "🌾 Полевая грунтовка (в дождь вязко)",
        shore: "🌿 Омуты, обрывы, прогалы в кустах",
        boat: "🛶 Спуск лодки на руках"
      },
      {
        id: 3,
        name: "Большеморецкий пруд",
        district: "Еланский р-н",
        coords: [50.9015, 42.3412],
        fish: "Карась, карп, окунь",
        road: "🌾 Полевая грунтовка",
        shore: "🌿 Прогалы в камыше, плотина",
        boat: "❌ Заросший берег, слипа нет"
      },
      {
        id: 4,
        name: "Пруд у х. Тростянка",
        district: "Еланский р-н",
        coords: [50.9983, 41.9754],
        fish: "Карась, карп, линь",
        road: "🌾 Сухая грунтовка",
        shore: "🎣 Удобный пологий берег",
        boat: "🛶 Спуск надувной лодки"
      },
      {
        id: 5,
        name: "Пруд балки Хвощинка",
        district: "Еланский р-н",
        coords: [50.8214, 42.0125],
        fish: "Карась, зеркальный карп, окунь",
        road: "🌾 Балочная накатанная колея",
        shore: "🌿 Местами зарос камышом",
        boat: "🛶 Спуск с плотины на руках"
      },
      {
        id: 6,
        name: "Родинский пруд",
        district: "Еланский р-н",
        coords: [51.0850, 42.1240],
        fish: "Карась, белый амур, карп",
        road: "🌾 Полевой подъезд",
        shore: "🎣 Подходы возле плотины",
        boat: "❌ Спуска для прицепа нет"
      },
      {
        id: 7,
        name: "Устье Терсы (р. Медведица)",
        district: "Руднянский р-н",
        coords: [50.7925, 44.5480],
        fish: "Сом, судак, сазан, щука, жерех",
        road: "🚗 Хороший подъезд по окраине Рудни",
        shore: "🎣 Песчаные косы и ямы",
        boat: "🚤 Есть места для съезда лодки"
      },
      {
        id: 8,
        name: "Река Медведица (Лемешкино)",
        district: "Руднянский р-н",
        coords: [50.8932, 44.4921],
        fish: "Голавль, жерех, щука, судак",
        road: "🌾 Твердая пойменная грунтовка",
        shore: "🎣 Перекат, песчаные пляжи",
        boat: "🛶 Спуск на руках (ПВХ)"
      },
      {
        id: 9,
        name: "Река Медведица (Матышево)",
        district: "Руднянский р-н",
        coords: [50.9814, 44.5126],
        fish: "Щука, сазан, язь, окунь",
        road: "🌾 Подъезд через пойменный лес",
        shore: "🎣 Песчаные косы ниже моста",
        boat: "🛶 Спуск лодки с песчаного берега"
      },
      {
        id: 10,
        name: "Старица / затон Ильмень",
        district: "Руднянский р-н",
        coords: [50.7511, 44.5822],
        fish: "Щука, окунь, линь, красноперка",
        road: "🌾 Грунтовка от села Ильмень",
        shore: "🌿 Обилие камыша и кувшинки",
        boat: "🛶 Спуск легкой лодки на руках"
      },
      {
        id: 11,
        name: "Пруд у с. Осички",
        district: "Руднянский р-н",
        coords: [50.6415, 44.4830],
        fish: "Карп, карась, толстолобик",
        road: "🌾 Наезженная полевая дорога",
        shore: "🎣 Чистые карповые сектора",
        boat: "🛶 Спуск надувной лодки"
      },
      {
        id: 12,
        name: "Пруд балки Лопуховка",
        district: "Руднянский р-н",
        coords: [50.6120, 44.7115],
        fish: "Карась, окунь, плотва",
        road: "🌾 Сухой степной проезд",
        shore: "🎣 Пологий берег с бровками",
        boat: "❌ Без спуска для катеров"
      }
    ];

    // Отрисовка списка в нижней панели
    function renderSpotsList(items) {
      const list = document.getElementById('spotsList');
      list.innerHTML = items.map(s => `
        <div class="spot-chip" onclick="showSpotDetails(${s.id})">
          <div class="spot-chip-title">${s.name}</div>
          <div class="spot-chip-desc">🐟 ${s.fish}</div>
          <div class="spot-chip-meta">${s.district}</div>
        </div>
      `).join('');
    }

    window.filterSpots = function(district, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (district === 'all') {
        renderSpotsList(spotsDirectory);
      } else {
        renderSpotsList(spotsDirectory.filter(s => s.district === district));
      }
    };

    renderSpotsList(spotsDirectory);

    // Открытие окна с деталями выбранного водоема
    window.showSpotDetails = function(id) {
      const spot = spotsDirectory.find(s => s.id === id);
      if (!spot) return;

      document.getElementById('detailName').innerText = spot.name;
      document.getElementById('detailDistrict').innerText = spot.district;
      document.getElementById('detailFish').innerHTML = `<b>Рыба:</b> ${spot.fish}`;
      document.getElementById('detailCoords').innerText = `Координаты: ${spot.coords[0].toFixed(5)}, ${spot.coords[1].toFixed(5)}`;

      document.getElementById('detailConditions').innerHTML = `
        <div class="cond-tag">${spot.road}</div>
        <div class="cond-tag">${spot.shore}</div>
        <div class="cond-tag">${spot.boat}</div>
      `;

      document.getElementById('detailBtnCopy').onclick = () => copyCoords(spot.coords[0], spot.coords[1]);
      document.getElementById('detailBtnNav').href = `https://yandex.ru/maps/?rtext=~${spot.coords[0]},${spot.coords[1]}&rtt=auto`;
      document.getElementById('detailBtnReport').onclick = () => {
        closeSpotDetails();
        openReportModal(spot.coords[0], spot.coords[1], spot.name, spot.district);
      };

      // Плавный перелет карты к водоему
      map.flyTo([spot.coords[0], spot.coords[1]], 14, { duration: 1.0 });

      document.getElementById('spotDetailsModal').classList.add('active');
    };

    window.closeSpotDetails = function() {
      document.getElementById('spotDetailsModal').classList.remove('active');
    };

    // 4. Отчеты пользователей
    function openReportModal(lat = '', lng = '', name = '', district = '') {
      if (lat && lng) {
        document.getElementById('spotCoords').value = `${Number(lat).toFixed(6)}, ${Number(lng).toFixed(6)}`;
      }
      if (name) document.getElementById('spotName').value = name;
      if (district) document.getElementById('spotDistrict').value = district;
      document.getElementById('spotDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('reportModal').classList.add('active');
    }

    function closeReportModal() { document.getElementById('reportModal').classList.remove('active'); }

    let userReports = JSON.parse(localStorage.getItem('elan_fish_reports') || '[]');

    function openReportsList() {
      const container = document.getElementById('reportsContainer');
      if (userReports.length === 0) {
        container.innerHTML = '<p style="color:#888; font-size:13px; text-align:center; padding: 20px 0;">У вас пока нет сохраненных отчетов.</p>';
      } else {
        container.innerHTML = userReports.map((r, i) => `
          <div style="background:#1a1a1b; padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid #333;">
            <h4 style="color:#ff9e00; font-size:13px;">${r.name} (${r.district})</h4>
            <div class="conditions-grid" style="margin: 4px 0;">
              <div class="cond-tag">${r.road}</div>
              <div class="cond-tag">${r.shore}</div>
              <div class="cond-tag">${r.boat}</div>
            </div>
            <p style="font-size:12px; margin: 3px 0;"><b>Улов:</b> ${r.fish || '-'}</p>
            <p style="font-size:11px; color:#aaa;">${r.date || '-'} | Координаты: ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</p>
            <div class="btn-group" style="margin-top:6px;">
              <button class="btn btn-copy" onclick="copyCoords(${r.lat}, ${r.lng})">📋 Координаты</button>
              <button class="btn btn-del" onclick="deleteReport(${i})">Удалить</button>
            </div>
          </div>
        `).join('');
      }
      document.getElementById('listModal').classList.add('active');
    }

    function closeListModal() { document.getElementById('listModal').classList.remove('active'); }

    function saveFishingReport() {
      const name = document.getElementById('spotName').value.trim();
      const district = document.getElementById('spotDistrict').value;
      const coordsRaw = document.getElementById('spotCoords').value.trim();
      const road = document.getElementById('roadCondition').value;
      const shore = document.getElementById('shoreCondition').value;
      const boat = document.getElementById('boatCondition').value;
      const date = document.getElementById('spotDate').value;
      const fish = document.getElementById('spotFish').value.trim();
      const notes = document.getElementById('spotNotes').value.trim();

      if (!name) { alert('Введите название водоема'); return; }
      const parts = coordsRaw.split(/[,;\s]+/).map(p => parseFloat(p));
      if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) {
        alert('Укажите корректные координаты'); return;
      }

      userReports.push({ name, district, lat: parts[0], lng: parts[1], road, shore, boat, date, fish, notes });
      localStorage.setItem('elan_fish_reports', JSON.stringify(userReports));
      closeReportModal();

      document.getElementById('spotName').value = '';
      document.getElementById('spotCoords').value = '';
      document.getElementById('spotFish').value = '';
      document.getElementById('spotNotes').value = '';

      showToast('Отчет успешно сохранен!');
    }

    window.deleteReport = function(index) {
      if (confirm('Удалить отчет?')) {
        userReports.splice(index, 1);
        localStorage.setItem('elan_fish_reports', JSON.stringify(userReports));
        openReportsList();
      }
    };

    // 5. Клик по произвольному месту карты для снятия координат
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      L.popup().setLatLng(e.latlng).setContent(`
        <div class="spot-card">
          <h3>Выбранное место</h3>
          <p><b>Координаты:</b> ${lat.toFixed(6)}, ${lng.toFixed(6)}</p>
          <div class="btn-group" style="flex-direction: column;">
            <button class="btn btn-add-here" onclick="openReportModal(${lat}, ${lng})">📝 Создать отчет здесь</button>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-copy" onclick="copyCoords(${lat}, ${lng})">📋 Скопировать</button>
              <a class="btn btn-nav" href="https://yandex.ru/maps/?rtext=~${lat},${lng}&rtt=auto" target="_blank">Маршрут</a>
            </div>
          </div>
        </div>
      `).openOn(map);
    });
  </script>
</body>
</html>
